<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Меню — блюда на заказ</title>
  <style>
    :root {
      --cream: #f5f0e5;
      --green: #213c2d;
      --muted: #687269;
      --line: #d7d8cc;
    }

    * { box-sizing: border-box; }

    html { background: var(--cream); }

    body {
      margin: 0;
      min-width: 0;
      overflow-x: hidden;
      background: var(--cream);
      color: var(--green);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .menu {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: 34px 22px 48px;
    }

    header {
      margin-bottom: 28px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font: 400 clamp(2.45rem, 11vw, 3.6rem)/1 Georgia, "Times New Roman", serif;
      letter-spacing: -0.035em;
    }

    .subtitle {
      max-width: 42rem;
      margin: 10px auto 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .section-picker {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 18px;
      padding: 22px 0 24px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    select, input[type="search"] {
      display: block;
      width: 100%;
      min-height: 48px;
      border: 1px solid #bcc4ba;
      border-radius: 0;
      background: #fbf8f1;
      color: var(--green);
      padding: 10px 40px 10px 12px;
      font: 400 1rem/1.3 Arial, Helvetica, sans-serif;
    }

    select:focus, input[type="search"]:focus, .clear-search:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 2px;
    }

    .picker-field { min-width: 0; }
    .search-field { position: relative; }
    input[type="search"] { padding-right: 48px; appearance: none; }
    input[type="search"]::placeholder { color: var(--muted); opacity: 1; }
    input[type="search"]::-webkit-search-cancel-button { display: none; }
    .clear-search {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--green);
      font: 400 1.6rem/1 Arial, Helvetica, sans-serif;
      cursor: pointer;
    }
    .search-hint, .search-status, .empty-state {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .dish-category {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.76rem;
    }
    .empty-state { padding: 20px 0; font-size: 0.94rem; }
    [hidden] { display: none !important; }

    @media (max-width: 520px) {
      .section-picker { grid-template-columns: minmax(0, 1fr); }
    }

    .section-title {
      margin: 28px 0 6px;
      font: 400 clamp(1.8rem, 8vw, 2.5rem)/1.1 Georgia, "Times New Roman", serif;
    }

    .dish {
      min-width: 0;
      padding: 18px 0 19px;
      border-bottom: 1px solid var(--line);
    }

    .dish-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 16px;
    }

    .dish-name {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
      font: 400 1.12rem/1.35 Georgia, "Times New Roman", serif;
    }

    .dish-price {
      padding-top: 2px;
      white-space: nowrap;
      font-size: 0.94rem;
      font-variant-numeric: tabular-nums;
    }

    .dish-description {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .dish-portion {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.4;
    }

    @media (max-width: 360px) {
      .menu { padding-right: 16px; padding-left: 16px; }
      .dish-heading { gap: 10px; }
      .dish-name { font-size: 1.04rem; }
    }
  </style>
</head>
<body>
  <main class="menu">
    <header>
      <h1>Меню</h1>
      <p class="subtitle">Заказы принимаются предварительно за 2–3 дня. Доставка по городу — 350 руб., за пределами города — 500 руб. Телефон: 8 (914) 860-50-40. Татьяна.</p>
    </header>

    <div class="section-picker">
      <div class="picker-field">
        <label for="section-select">Раздел</label>
        <select id="section-select" aria-controls="dish-list"></select>
      </div>
      <div class="picker-field">
        <label for="dish-search">Поиск блюда</label>
        <div class="search-field">
          <input id="dish-search" type="search" placeholder="Название или ингредиент"
            autocomplete="off" aria-controls="dish-list" aria-describedby="search-hint">
          <button id="clear-search" class="clear-search" type="button" aria-label="Очистить поиск" hidden>×</button>
        </div>
        <p id="search-hint" class="search-hint">Поиск по всем разделам меню</p>
      </div>
    </div>

    <section aria-labelledby="section-title">
      <h2 class="section-title" id="section-title"></h2>
      <p id="search-status" class="search-status" role="status" aria-live="polite" aria-atomic="true"></p>
      <p id="empty-state" class="empty-state" hidden>Ничего не найдено. Попробуйте другое название или ингредиент.</p>
      <div id="dish-list"></div>
    </section>
  </main>

  <script>
    (() => {
      const sections = JSON.parse(document.getElementById('menu-data').textContent);
      const select = document.getElementById('section-select');
      const title = document.getElementById('section-title');
      const list = document.getElementById('dish-list');
      const search = document.getElementById('dish-search');
      const clear = document.getElementById('clear-search');
      const status = document.getElementById('search-status');
      const empty = document.getElementById('empty-state');
      const formatPrice = value => new Intl.NumberFormat('ru-RU').format(value) + ' ₽';
      const normalize = value => value.toLocaleLowerCase('ru-RU').replace(/ё/g, 'е').trim();
      const allDishes = sections.flatMap(section => section.items.map(item => ({
        item,
        section: section.title,
        searchable: normalize([item.name, item.description, item.portion].join(' '))
      })));

      function renderDish(item, sectionName) {
        const article = document.createElement('article');
        article.className = 'dish';
        if (sectionName) {
          const category = document.createElement('p');
          category.className = 'dish-category';
          category.textContent = sectionName;
          article.append(category);
        }
        const heading = document.createElement('div');
        heading.className = 'dish-heading';
        const name = document.createElement('h3');
        name.className = 'dish-name';
        name.textContent = item.name;
        const price = document.createElement('span');
        price.className = 'dish-price';
        price.textContent = formatPrice(item.price);
        heading.append(name, price);
        article.append(heading);
        if (item.description) {
          const description = document.createElement('p');
          description.className = 'dish-description';
          description.textContent = item.description;
          article.append(description);
        }
        const portion = document.createElement('p');
        portion.className = 'dish-portion';
        portion.textContent = item.portion;
        article.append(portion);
        return article;
      }

      function render() {
        const query = normalize(search.value);
        clear.hidden = search.value.length === 0;
        if (query) {
          const words = query.split(/\s+/);
          const matches = allDishes.filter(dish => words.every(word => dish.searchable.includes(word)));
          title.textContent = 'Результаты поиска';
          status.textContent = 'Найдено блюд: ' + matches.length;
          empty.hidden = matches.length > 0;
          list.replaceChildren(...matches.map(dish => renderDish(dish.item, dish.section)));
        } else {
          const section = sections[Number(select.value)];
          title.textContent = section.title;
          status.textContent = '';
          empty.hidden = true;
          list.replaceChildren(...section.items.map(item => renderDish(item)));
        }
      }

      sections.forEach((section, index) => {
        const option = document.createElement('option');
        option.value = String(index);
        option.textContent = section.title;
        select.append(option);
      });
      search.addEventListener('input', render);
      select.addEventListener('change', () => { search.value = ''; render(); });
      clear.addEventListener('click', () => { search.value = ''; render(); search.focus(); });
      search.addEventListener('keydown', event => {
        if (event.key === 'Escape') { search.value = ''; render(); }
      });
      render();
    })();
  </script>
